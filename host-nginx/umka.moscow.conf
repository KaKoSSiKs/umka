# Хостовый nginx (VPS): reverse proxy → Docker umka-web на 127.0.0.1:8084
# Установка:
#   cp /opt/umka/host-nginx/umka.moscow.conf /etc/nginx/sites-available/umka.moscow
#   ln -sf /etc/nginx/sites-available/umka.moscow /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
# Затем SSL:
#   certbot --nginx -d xn--80atf1a.xn--80adxhks -d умка.москва

server {
    listen 80;
    listen [::]:80;
    server_name умка.москва xn--80atf1a.xn--80adxhks;

    location / {
        proxy_pass http://127.0.0.1:8084;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
